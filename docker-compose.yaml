services:
  db:
    image: mariadb:10.6
    container_name: booksy_db_cont
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: booksy_db
    ports:
      - "3307:3306" # Łączysz się przez localhost:3307
    volumes:
      # Automatyczne tworzenie bazy i tabel przy starcie[cite: 1, 5, 6]
      - ./db/booksy_db.sql:/docker-entrypoint-initdb.d/1.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2.sql
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4096M

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: booksy_pma
    restart: always
    ports:
      - "8080:80" # Panel dostępny pod localhost:8080
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password